<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>
    (function() {
      var saved = localStorage.getItem('sakura-garden-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sakura garden</title>
  <link rel="icon" href="favicon.ico" />
  <meta name="description" content="A GitHub contributions garden for your README or portfolio — commits bloom into sakura flowers 🌸" />
  <meta property="og:title" content="sakura garden" />
  <meta property="og:description" content="A GitHub contributions garden for your README or portfolio — commits bloom into sakura flowers 🌸" />
  <meta property="og:image" content="https://sakura-garden.vercel.app/og-image.png" />
  <meta property="og:url" content="https://sakura-garden.vercel.app" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="sakura garden" />
  <meta name="twitter:description" content="A GitHub contributions garden for your README or portfolio — commits bloom into sakura flowers 🌸" />
  <meta name="twitter:image" content="https://sakura-garden.vercel.app/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    /* ─── THEMES ─────────────────────────────────────────────────── */
    :root, [data-theme="dark"] {
      --mono-text: #ffffff;
      --bg: #010409;
      --surface: #0d1117;
      --surface2: #1a1a1f;
      --border: #252530;
      --border2: #2e2e3a;
      --text: #f0f6fc;
      --text2: #f0f6fc;
      --text3: #9198a1;
      --accent: #ff85b3;
      --c0: #1a1a22;
      --c1: #6b1f35;
      --c2: #c2185b;
      --c3: #ff85b3;
      --c4: #ff8fab;
      --lvl1: #6b1f35;
      --lvl2: #6b1f35;
      --lvl3: #6b1f35;
      --lvl4: #6b1f35;
      --center1: color-mix(in srgb, var(--lvl1) 35%, white);
      --center2: color-mix(in srgb, var(--lvl2) 35%, white);
      --center3: color-mix(in srgb, var(--lvl3) 35%, white);
      --center4: color-mix(in srgb, var(--lvl4) 35%, white);
      --shadow: 0 4px 24px rgba(0,0,0,0.35);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.25);
    }

    [data-theme="light"] {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface2: #f6f8fa;
      --border: #dcdce8;
      --border2: #c8c8dc;
      --text: #111118;
      --text2: #52526a;
      --text3: #9898b8;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --mono-text: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { 
      overflow-x: hidden;
      width: 100%;
    }

    html { transition: background 0.25s; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      transition: background 0.25s;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* ─── DECORATIVE GIANT BLOOMS (card only) ───────────────────── */
    .deco-bloom--inner {
      position: absolute;
      top: -40px;
      right: -30px;
      width: 220px;
      height: 220px;
      opacity: 0.055;
      pointer-events: none;
      z-index: 0;
      transform: rotate(12deg);
    }
    [data-theme="light"] .deco-bloom--inner { opacity: 0.08; }
    .deco-bloom--inner svg ellipse { fill: var(--accent); transition: fill 0.25s; }
    .deco-bloom--inner svg circle { fill: var(--accent); opacity: 0.55; transition: fill 0.25s; }

    .deco-bloom--inner2 {
      position: absolute;
      bottom: -35px;
      left: -25px;
      width: 150px;
      height: 150px;
      opacity: 0.05;
      pointer-events: none;
      z-index: 0;
      transform: rotate(-22deg);
    }
    [data-theme="light"] .deco-bloom--inner2 { opacity: 0.075; }
    .deco-bloom--inner2 svg ellipse { fill: var(--accent); transition: fill 0.25s; }
    .deco-bloom--inner2 svg circle { fill: var(--accent); opacity: 0.55; transition: fill 0.25s; }

    @media (max-width: 812px) {
      .deco-bloom--inner { width: 150px; height: 150px; top: -25px; right: -25px; opacity: 0.06; }
      .deco-bloom--inner2 { display: none; }
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 971.5px;
      margin: 0 auto;
      padding: 3rem 1.5rem 6rem;
      width: 100%;
    }

    .readme-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 0.8rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      font-size: 0.72rem;
      color: var(--text3);
      transition: background 0.25s;
    }
    .readme-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .readme-dot.r { background: #ff5f57; }
    .readme-dot.y { background: #febc2e; }
    .readme-dot.g { background: #28c840; }
    .readme-filename { font-size: 0.7rem; color: var(--text3); }

    .toolbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .labels-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .theme-label {
      font-size: 0.65rem;
      color: var(--text3);
      letter-spacing: 0.04em;
    }
    .mini-toggle-track {
      position: relative;
      width: 30px;
      height: 16px;
      background: var(--border2);
      border-radius: 8px;
      cursor: pointer;
      border: none;
      padding: 0;
      transition: background 0.25s;
      flex-shrink: 0;
    }
    .mini-toggle-track:hover { opacity: 0.85; }
    .mini-toggle-track.on { background: var(--accent); }
    .mini-toggle-thumb {
      position: absolute;
      top: 2px; left: 2px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.22s cubic-bezier(.4, 0, .2, 1);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .mini-toggle-track.on .mini-toggle-thumb { transform: translateX(14px); }
    .toggle-track {
      position: relative;
      width: 36px;
      height: 20px;
      background: var(--border2);
      border-radius: 10px;
      cursor: pointer;
      border: none;
      padding: 0;
      transition: background 0.25s;
      flex-shrink: 0;
    }
    .toggle-track:hover { opacity: 0.85; }
    [data-theme="light"] .toggle-track { background: var(--accent); }
    .toggle-thumb {
      position: absolute;
      top: 3px; left: 3px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.22s cubic-bezier(.4, 0, .2, 1);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    [data-theme="light"] .toggle-thumb { transform: translateX(16px); }
    .toggle-icon {
      font-size: 0.75rem;
      line-height: 1;
      user-select: none;
      width: 20px;
      display: inline-block;
      text-align: center;
    }

    .readme-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 2.5rem 2rem 2rem;
      transition: background 0.25s;
      box-shadow: var(--shadow);
      max-width: 100%;
      position: relative;
      overflow: hidden;
    }

    .md-h1 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: clamp(1.3rem, 3.2vw, 1.75rem);
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .md-h1 .highlight {
      color: var(--accent);
    }

    .md-badge-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 1rem 0 1.5rem; }
    .md-badge {
      font-size: 0.65rem;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--mono-text);
      letter-spacing: 0.04em;
      transition: background 0.25s;
    }
    .md-badge.primary {
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      border-color: color-mix(in srgb, var(--accent) 40%, transparent);
      color: var(--c4, #ff8fab);
    }

    .md-p { font-size: 0.88rem; color: var(--mono-text); margin-bottom: 1.2rem; text-align: center; }
    .md-p code {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 3px;
      padding: 0.1em 0.4em;
      font-size: 0.85em;
      color: var(--text);
      transition: background 0.25s;
    }

    .md-h2 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }
    .md-h2::before { content: '## '; color: var(--mono-text); }

    .hero-flex {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      margin-bottom: 0.75rem;
      width: 100%;
    }
    .hero-main {
      flex: 1 1 500px;
      min-width: 0;
    }
    .hero-main .md-h1,
    .hero-main .md-p { text-align: left; }
    .hero-main .search-row { justify-content: flex-start; }

    .search-row { display: flex; gap: 0.5rem; margin: 1.75rem 0 0.5rem; width: 100%;}
    .search-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border2));
      border-radius: 6px;
      padding: 0.65rem 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 0.85rem;
      color: var(--text);
      outline: none;
      transition: box-shadow 0.2s, background 0.25s;
    }
    .search-input::placeholder { color: var(--text3); }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    .search-btn {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--accent);
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(.4, 0, .2, 1), box-shadow 0.18s, filter 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .search-btn:hover {
      transform: translateY(-2px);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .search-btn:active {
      transform: translateY(0);
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 30%, transparent);
    }

    #result { margin-top: 0; max-width: 100%; }

    .loader { font-size: 0.8rem; color: var(--mono-text); padding: 2rem 0; text-align: center; }
    .spinner { display: inline-block; animation: spin 1s linear infinite; margin-right: 0.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .demo-note {
      font-size: 0.82rem;
      color: var(--mono-text);
      margin: 0.25rem 0 1.4rem;
      line-height: 1.7;
    }
    .demo-note strong { color: var(--mono-text); font-weight: 500; }

    .error-msg {
      font-size: 0.8rem; color: #f87171;
      padding: 1rem;
      background: rgba(248,113,113,0.06);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 6px;
    }

    .profile-row { display: flex; align-items: center; justify-content: space-between; gap: 0.9rem; margin-bottom: 1.2rem; }
    .profile-info { display: flex; align-items: center; gap: 0.9rem; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--border2); }
    .profile-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  ; font-size: 1.1rem; font-weight: 700; }
    .profile-sub { font-size: 0.82rem; color: var(--mono-text); }

    .stats-row { display: flex; gap: 1.5rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
    .stat { font-size: 0.72rem; color: var(--mono-text); }
    .stat strong {
      display: block;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--c3, var(--accent));
      line-height: 1.1;
    }

    .graph-container {
      position: relative;
      background:transparent;
      padding: 1rem 1rem 0.8rem;
      overflow-x: auto;
      margin-bottom: 0.2rem;
      -webkit-overflow-scrolling: touch;
      transition: background 0.25s;
      max-width: 100%;
    }
    .graph-toggle { position: absolute; top: 0.7rem; left: 0.8rem; margin-left: 0; }
    .graph-scroll { display: inline-block; }
    .month-row { position: relative; height: 16px; margin-bottom: 4px; }
    .month-label { position: absolute; font-size: 0.65rem; color: var(--mono-text); }
    .graph-body { display: flex; align-items: flex-start; }
    .day-labels { display: flex; flex-direction: column; gap: 2px; margin-right: 4px; padding-top: 1px; }
    .day-label { width: 20px; height: 13px; font-size: 0.6rem; color: var(--mono-text); display: flex; align-items: center; justify-content: flex-end; }
    .weeks { display: flex; gap: 2px; }
    .week { display: flex; flex-direction: column; gap: 2px; }

    .day-cell {
      width: 13px; height: 13px;
      border-radius: 2px;
      background: transparent;
      cursor: pointer;
      transition: opacity 0.1s, transform 0.1s;
      position: relative;
    }
    .day-cell:hover { opacity: 0.85; transform: scale(1.35); z-index: 5; }
    .day-cell.zero svg { display: block; width: 100%; height: 100%; overflow: visible; }

    /* Bloom entrance animation */
    @keyframes bloom {
      0% { transform: scale(0) rotate(-15deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .bloom-cell svg {
      animation: bloom 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
      animation-delay: var(--delay);
      transform-origin: center;
    }

    .legend-row {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 0.5rem; font-size: 0.65rem; color: var(--mono-text);
      padding: 0.5rem 0 0.1rem;
    }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 2px;
      display: inline-block;
    }

    #tooltip {
      position: fixed;
      display: none;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 5px;
      padding: 0.3rem 0.6rem;
      font-size: 0.7rem;
      color: var(--text);
      pointer-events: none;
      z-index: 999;
      white-space: nowrap;
      box-shadow: var(--shadow);
      transition: background 0.25s;
    }

    .quick-copy-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
      max-width: 100%;
    }
    .quick-copy {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: transparent;
      color: var(--text);
      border: 2px solid var(--accent);
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(.4, 0, .2, 1), box-shadow 0.18s, filter 0.15s, background 0.15s;
      max-width: 100%;
    }
    .quick-copy:hover {
      transform: translateY(-2px);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .quick-copy:active {
      transform: translateY(0);
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .quick-copy.copied { border-color: #4ade80; }
    .quick-copy-tag {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .quick-copy-icon { font-size: 0.9rem; }

    .demo-star-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1.4rem;
    }
    .demo-star-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: transparent;
      color: var(--text);
      border: 2px solid var(--accent);
      border-radius: 6px;
      padding: 0.6rem 1.15rem;
      text-decoration: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      transition: transform 0.18s cubic-bezier(.4, 0, .2, 1), box-shadow 0.18s, filter 0.15s, background 0.15s;
    }
    .demo-star-btn:hover {
      transform: translateY(-2px);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .demo-star-btn:active {
      transform: translateY(0);
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .demo-star-btn-icon { font-size: 0.95rem; line-height: 1; }

    .gitcolors-note {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.7rem;
      color: var(--mono-text);
    }
    .gitcolors-note a {
      font-weight: 700;
      color: var(--mono-text);
      text-decoration: underline;
    }
    .gitcolors-note a:hover { color: var(--text); }

    .about-section {
      margin-top: 2.5rem; padding-top: 0;
      font-size: 0.75rem; color: var(--mono-text);
      display: flex; justify-content: center;
      align-items: center; flex-wrap: wrap; gap: 0.5rem;
      text-align: center;
    }
    .about-section a { color: var(--mono-text); text-decoration: none; }
    .about-section a:hover { color: var(--text); }

    @media (max-width: 812px) {
      .hero-flex { flex-direction: column; gap: 1.5rem; }
      .hero-main { flex: none; width: 100%; max-width: 100%; text-align: center; }
      .hero-main .md-h1,
      .hero-main .md-p { text-align: center; }
      .hero-main .search-row { justify-content: center; }
    }

    @media (max-width: 600px) {
      .wrapper { padding: 1.5rem 1rem 5rem; }
      .readme-body { padding: 1.5rem 1rem; }
      .search-row { flex-direction: column; width: 100%; }
      .search-input { width: 100%; text-align: center; }
      .search-btn { width: 100%; }
      .theme-label { display: none; }
    }

  </style>
<base target="_blank">
</head>
<body>

<div id="tooltip"></div>

<div class="wrapper">
  <div class="readme-bar">
    <span class="readme-filename">README.md</span>
    <div class="toolbar-right">
      <div class="labels-toggle">
        <span class="theme-label">labels</span>
        <button class="mini-toggle-track on" id="labelsToggleBtn" onclick="toggleLabels()" title="Show/hide month and weekday labels">
          <div class="mini-toggle-thumb"></div>
        </button>
      </div>
      <div class="theme-toggle">
        <span class="toggle-icon">🌙</span>
        <button class="toggle-track" onclick="toggleTheme()" title="Toggle theme">
          <div class="toggle-thumb"></div>
        </button>
        <span class="toggle-icon">☀️</span>
      </div>
    </div>
  </div>

  <div class="readme-body">
    <div class="hero-flex">
      <div class="hero-main">
        <h1 class="md-h1"><span class="highlight">sakura garden</span></h1>
        <p class="md-p">
          Your GitHub contributions garden
          <br>Add it to your GitHub profile README in seconds
        </p>
        <div class="search-row">
          <input id="usernameInput" class="search-input" type="text"
            placeholder="your github username" autocomplete="off" spellcheck="false" />
          <button class="search-btn" onclick="doSearch()">→ bloom</button>
        </div>
      </div>
    </div>

    <div id="result">
      <div class="loader">
        <span class="spinner">◌</span>
        loading example…
      </div>
    </div>
    <div class="about-section">
      <span>made with 🌸</span>
    </div>

  </div>
</div>

<script>
function initTheme() {
  const saved = localStorage.getItem('sakura-garden-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('sakura-garden-theme', next);
  refreshGraph();
}

initTheme();

function hexToRgbArr(hex) {
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
}

function lighten(hex, amt) {
  const [r,g,b] = hexToRgbArr(hex);
  const nr = Math.round(r + (255-r)*amt);
  const ng = Math.round(g + (255-g)*amt);
  const nb = Math.round(b + (255-b)*amt);
  return '#' + [nr,ng,nb].map(x=>x.toString(16).padStart(2,'0')).join('');
}

let lastWeeksData = null;
let showLabels = true;

function toggleLabels() {
  showLabels = !showLabels;
  const btn = document.getElementById('labelsToggleBtn');
  if (btn) btn.classList.toggle('on', showLabels);
  refreshGraph();
  if (currentUsername) updateEmbedCode();
}

// Paleta sakura fixa — igual em dark e light mode (mesma paleta usada no api/svg.js)
const SAKURA_PETAL = ['', '#ffb3cc', '#ff85b3', '#ff3d7f', '#c2005a'];
const SAKURA_CENTER = ['', '#ffe0ee', '#ffcce0', '#ffaacc', '#ff80aa'];

// Paleta kawaii — só muda o light mode (verde-menta + ramo de rosas mais vivo);
// o dark mode é igual ao sakura original (mesma paleta usada no api/svg.js)
const KAWAII_PETAL = ['', '#ff85ad', '#ff5c92', '#ff3d7f', '#ff0055'];
const KAWAII_CENTER = ['', '#ffcede', '#ffbed3', '#ffb1cc', '#ff99bb'];

const THEMES = {
  kawaii: {
    label: '🌷 kawaii',
    accent: '#ff3d7f',
    getCellColor(wi, total, level) {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (level === 0) return { fill: 'transparent', stroke: isLight ? '#2dd256' : '#4a7a44', hex: '#ff3d7f' };
      const hex = isLight ? KAWAII_PETAL[level] : SAKURA_PETAL[level];
      const center = isLight ? KAWAII_CENTER[level] : SAKURA_CENTER[level];
      return { fill: hex, stroke: hex, hex, center };
    },
  },
};

function refreshGraph() {
  if (!lastWeeksData) return;
  const container = document.querySelector('.graph-container');
  if (!container) return;
  container.innerHTML = `${buildGraph(lastWeeksData)}<div class="legend-row" id="graphLegend"></div>`;
  setupTooltips();
  updateLegend();
  fitGraphToContainer();
}

function applyLiveColor(hex) {
  const root = document.documentElement;
  root.style.setProperty('--lvl1', hex);
  root.style.setProperty('--lvl2', hex);
  root.style.setProperty('--lvl3', hex);
  root.style.setProperty('--lvl4', hex);
  root.style.setProperty('--c1', hex);
  root.style.setProperty('--c2', hex);
  root.style.setProperty('--c3', hex);
  root.style.setProperty('--c4', hex);
  root.style.setProperty('--accent', hex);
  updateLegend();
}

let currentUsername = '';

const API_BASE = 'https://sakura-garden.vercel.app/api/contributions';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

async function doSearch() {
  const username = document.getElementById('usernameInput').value.trim();
  if (!username) return;
  currentUsername = username;
  quickCopyState = 'idle';
  const result = document.getElementById('result');
  result.innerHTML = `<div class="loader"><span class="spinner">◌</span> fetching <strong>${username}</strong>…</div>`;
  try {
    const res = await fetch(`${API_BASE}?username=${encodeURIComponent(username)}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderResult(data, false);
  } catch(err) {
    result.innerHTML = `<div class="error-msg">✗ couldn't find ${username} — check the username and try again.</div>`;
  }
}

document.getElementById('usernameInput').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

async function loadDemo() {
  try {
    const res = await fetch(`${API_BASE}?username=a104437ana`);
    const data = await res.json();

    if (data.error) {
      document.getElementById('result').innerHTML =
        `<p class="md-p" style="color:var(--mono-text);font-size:0.78rem;">↑ enter your username to see your garden</p>`;
      return;
    }

    renderResult(data, true);

  } catch (err) {
    document.getElementById('result').innerHTML =
      `<p class="md-p" style="color:var(--mono-text);font-size:0.78rem;">↑ enter your username to see your garden</p>`;
  }
}

function getLevel(count) {
  if(count===0) return 0; if(count<=2) return 1; if(count<=5) return 2; if(count<=9) return 3; return 4;
}

function makePetal(level, fillColor, centerColor) {
  const fc = fillColor || `var(--lvl${level})`;
  const cc = centerColor || `var(--center${level})`;
  let petals = '';
  for (let a = 0; a < 5; a++) {
    petals += `<ellipse cx="0" cy="-3.2" rx="2.2" ry="3.5" fill="${fc}" transform="rotate(${a * 72})"/>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="-6.5 -6.5 13 13" style="display:block">${petals}<circle cx="0" cy="0" r="1.8" fill="${cc}"/></svg>`;
}

function buildGraph(weeks) {
  const STEP = 15;
  let monthHtml = '';
  if (showLabels) {
    monthHtml = '<div class="month-row">';
    let lastMonth = -1;
    let lastLabelWeek = -10;
    weeks.forEach((week,wi) => {
      const fd = week.contributionDays.find(d=>d.date);
      if (!fd) return;
      const date = new Date(fd.date);
      const m = date.getMonth();
      const d = date.getDate();
      if (m !== lastMonth && d <= 7 && (wi - lastLabelWeek) > 2) {
        monthHtml += `<span class="month-label" style="left:${24 + wi*STEP}px">${MONTHS[m]}</span>`;
        lastMonth = m;
        lastLabelWeek = wi;
      }
    });
    monthHtml += '</div>';
  }

  let dayLabels = '';
  if (showLabels) {
    dayLabels = '<div class="day-labels">';
    ['','Mon','','Wed','','Fri',''].forEach(d => { dayLabels += `<div class="day-label">${d}</div>`; });
    dayLabels += '</div>';
  }

  let weeksHtml = '<div class="weeks">';
  weeks.forEach((week, wi) => {
    weeksHtml += '<div class="week">';

    const dayMap = {};
    week.contributionDays.forEach(d => {
      const wd = d.weekday !== undefined ? d.weekday : new Date(d.date).getDay();
      dayMap[wd] = d;
    });

    for (let i = 0; i < 7; i++) {
      const day = dayMap[i];
      if (day) {
        const count = day.contributionCount;
        if (count > 0) {
          const level = getLevel(count);
          const res = THEMES.kawaii.getCellColor(wi, weeks.length, level);
          const fill = res.fill;
          const center = res.center || lighten(res.hex, 0.55);
          const delay = wi * 20 + i * 10;
          weeksHtml += `<div class="day-cell bloom-cell" data-count="${count}" data-date="${day.date}" style="--delay:${delay}ms">${makePetal(level, fill, center)}</div>`;
        } else {
          const emptyStroke = THEMES.kawaii.getCellColor(wi, weeks.length, 0).stroke;
          weeksHtml += `<div class="day-cell zero" data-count="0" data-date="${day.date}"><svg viewBox="0 0 11 11"><rect x="0" y="0" width="11" height="11" rx="2" fill="transparent" stroke="${emptyStroke}" stroke-width="0.8"/></svg></div>`;
        }
      } else {
        weeksHtml += `<div class="day-cell" style="visibility:hidden"></div>`;
      }
    }
    weeksHtml += '</div>';
  });
  weeksHtml += '</div>';

  return `<div class="graph-scroll">${monthHtml}<div class="graph-body">${dayLabels}${weeksHtml}</div></div>`;
}

function calcStreak(weeks) {
  let longest=0, current=0;
  weeks.flatMap(w=>w.contributionDays).forEach(d => {
    if(d.contributionCount>0){current++;longest=Math.max(longest,current);}else current=0;
  });
  return longest;
}

function updateLegend() {
  const el = document.getElementById('graphLegend');
  if (!el) return;
  el.innerHTML = `<span></span>`;
}

function renderResult(data, isDemo) {
  const user = data.user;
  const cal = user.contributionsCollection.contributionCalendar;
  lastWeeksData = cal.weeks;
  const total = cal.totalContributions;
  const longest = calcStreak(cal.weeks);

  const demoNote = isDemo
    ? `<p class="demo-note">showing an example:</p>`
    : `<br>`;

  const starCta = `
    <div class="demo-star-cta">
      <a class="demo-star-btn" href="https://github.com/a104437ana/sakura-garden" target="_blank">
        <span class="demo-star-btn-icon">⭐</span>
        <span>Check out the project on GitHub and consider giving it a star</span>
      </a>
    </div>
    <div class="gitcolors-note">
      Want your GitHub contributions graph in any color/theme? Check out <a href="https://gitcolors.vercel.app/" target="_blank">gitcolors</a>
    </div>
  `;

  const actionBlock = isDemo ? starCta : `
  <br>
    <div class="quick-copy-wrap">
      <div class="quick-copy" id="quickCopy" onclick="handleQuickCopy('${user.login}')" title="Copy the embed code, then click again to open your README and paste it">
        <span class="quick-copy-icon" id="quickCopyIcon">📋</span>
        <span class="quick-copy-tag" id="quickCopyLabel">copy garden</span>
      </div>
    </div>
    ${starCta}
  `;

  document.getElementById('result').innerHTML = `
    ${demoNote}
    <div class="profile-row">
      <div class="profile-info">
        <img class="avatar" src="${user.avatarUrl}" alt="${user.login}" />
        <div>
          <div class="profile-name">${user.name || user.login}</div>
          <div class="profile-sub">@${user.login} · last 365 days</div>
        </div>
      </div>
    </div>
    <div class="graph-container">
      ${buildGraph(cal.weeks)}
      <div class="legend-row" id="graphLegend"></div>
    </div>
    ${actionBlock}
  `;

  setupTooltips();
  updateLegend();
  fitGraphToContainer();
  if (!isDemo) updateEmbedCode();
}

function fitGraphToContainer() {
  const container = document.querySelector('.graph-container');
  const scrollEl = container && container.querySelector('.graph-scroll');
  if (!container || !scrollEl) return;
  scrollEl.style.zoom = '';
  const pad = 32; // matches .graph-container's left+right padding (1rem each)
  const available = container.clientWidth - pad;
  const natural = scrollEl.scrollWidth;
  if (natural > available && available > 0) {
    // zoom reflows text at the new size instead of stretching a cached bitmap
    // like transform: scale() does, so labels stay crisp instead of blurring.
    scrollEl.style.zoom = available / natural;
  }
}

let fitGraphResizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(fitGraphResizeTimer);
  fitGraphResizeTimer = setTimeout(fitGraphToContainer, 100);
});

function setupTooltips() {
  const tooltip = document.getElementById('tooltip');
  document.querySelectorAll('.day-cell[data-date]').forEach(cell => {
    cell.addEventListener('mousemove', e => {
      const count = parseInt(cell.dataset.count);
      const date = new Date(cell.dataset.date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
      tooltip.textContent = count===0 ? `no contributions · ${date}` : `${count} contribution${count!==1?'s':''} · ${date}`;
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX+12)+'px';
      tooltip.style.top  = (e.clientY-32)+'px';
    });
    cell.addEventListener('mouseleave', () => { tooltip.style.display='none'; });
  });
}

function getEmbedUrl(mode) {
  const themeParam = mode === 'dark' ? 'kawaii-dark' : 'kawaii';
  const labelsParam = showLabels ? '' : '&labels=false';
  return `https://sakura-garden.vercel.app/api/svg?username=${currentUsername}&theme=${themeParam}${labelsParam}`;
}

function getEmbedCode() {
  const l=getEmbedUrl('light'), d=getEmbedUrl('dark');
  const w = 846, h = showLabels ? 132 : 119;
  return `<a href="https://sakura-garden.vercel.app" target="_blank" rel="noopener">\n <picture>\n  <source srcset="${d}" media="(prefers-color-scheme: dark)" width="${w}" height="${h}" style="height:auto" />\n  <source srcset="${l}" media="(prefers-color-scheme: light)" width="${w}" height="${h}" style="height:auto" />\n  <img src="${l}" width="${w}" height="${h}" style="height:auto" />\n</picture>\n</a>`;
}

function updateEmbedCode() {
  const el = document.getElementById('embedText');
  if (!el || !currentUsername) return;
  el.textContent = getEmbedCode();
}


let quickCopyState = 'idle';

function resetQuickCopyState() {
  quickCopyState = 'idle';
  const quick = document.getElementById('quickCopy');
  const label = document.getElementById('quickCopyLabel');
  const icon = document.getElementById('quickCopyIcon');
  if (!quick || !label) return;
  quick.classList.remove('copied');
  label.textContent = 'copy garden';
  if (icon) icon.textContent = '📋';
}

function handleQuickCopy(login) {
  const quick = document.getElementById('quickCopy');
  const label = document.getElementById('quickCopyLabel');
  const icon = document.getElementById('quickCopyIcon');

  if (quickCopyState === 'idle') {
    navigator.clipboard.writeText(getEmbedCode());
    quickCopyState = 'copied';
    if (quick) quick.classList.add('copied');
    if (label) label.textContent = 'copied! now paste it in your README →';
    if (icon) icon.textContent = '✅';
  } else {
    window.open(`https://github.com/${login}/${login}/edit/main/README.md`, '_blank');
    setTimeout(resetQuickCopyState, 1500);
  }
}

applyLiveColor(THEMES.kawaii.accent);
loadDemo();
</script>
<script data-goatcounter="https://sakura-garden.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
